<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dovChat</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6f6e68;--acc:#1a73e8;--accink:#fff;--line:#e3e1d9;--me:#e3eeff}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--ink:#f1efe8;--mute:#9a988f;--acc:#8ab4f8;--accink:#10151f;--line:#2e2d2a;--me:#1f2d47}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1}
button,select,input{font:inherit}
button{cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:92%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--me)}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.hint{margin:auto 0}
.hint h2{font-size:24px;margin:0 0 4px}
.hint p{color:var(--mute);margin:0 0 12px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:8px 14px;margin:0 8px 8px 0}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:140px}
#send{background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:0 20px;font-weight:600}
#send:disabled{opacity:.5}
#key{display:none;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
#key.show{display:block}
#key p{margin:0 0 8px;color:var(--mute);font-size:14px}
#key div{display:flex;gap:8px}
#key input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#key button{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:0 16px}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🧠 dovChat</h1>
  <select id="mode" class="ghost" aria-label="Режим">
    <option value="gemini-flash-latest" selected>Обычный</option>
    <option value="gemini-flash-lite-latest">Быстрый</option>
    <option value="gemini-pro-latest">Глубокий</option>
  </select>
  <button class="ghost" id="keybtn" title="API-ключ">🔑</button>
  <button class="ghost" id="clear">Сброс</button>
</header>
<div id="key">
  <p>Вставь бесплатный ключ Google Gemini. Получить: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> (нужен только аккаунт Google, карта не нужна). Ключ хранится только в твоём браузере.</p>
  <div><input id="keyin" type="password" placeholder="AIza..." autocomplete="off"><button id="keysave">Сохранить</button></div>
</div>
<div id="log"></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Спроси что угодно…"></textarea>
  <button id="send" type="submit">➤</button>
</form>
</div>
<script>
const SYS="Тебя зовут dovChat. Ты — очень умный, внимательный и честный ИИ-ассистент. Отвечай на языке пользователя (по умолчанию на русском). Думай пошагово: разбирай задачу, проверяй логику и расчёты, замечай подвохи. Давай точные, полезные и лаконичные ответы; сложное объясняй просто, с примерами. Если не уверен — так и скажи, не выдумывай. Не используй markdown-разметку (звёздочки, решётки): пиши простым текстом, списки — через тире или цифры.";
const EX=["Объясни теорию относительности просто","Реши: было 3 яблока, съел 2, купил 5 — сколько?","Придумай идею стартапа","Напиши стих про осень"];
const $=id=>document.getElementById(id);
const log=$('log'),t=$('t'),send=$('send'),keyBox=$('key');
let hist=[],busy=false,ctl=null;
const getKey=()=>{try{return localStorage.getItem('gk')||''}catch(e){return window.__gk||''}};
const setKey=v=>{try{localStorage.setItem('gk',v)}catch(e){window.__gk=v}};

function el(c,txt){const d=document.createElement('div');d.className=c;d.textContent=txt||'';log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function home(){
  log.innerHTML='';
  const h=el('hint');
  const a=document.createElement('h2');a.textContent='Привет! Я dovChat.';
  const p=document.createElement('p');p.textContent='Спроси что угодно: логика, код, идеи, учёба, тексты.';
  h.append(a,p);
  EX.forEach(x=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=x;b.onclick=()=>ask(x);h.appendChild(b)});
}
async function ask(q){
  q=(q||'').trim(); if(!q||busy) return;
  if(!getKey()){keyBox.classList.add('show');$('keyin').focus();return}
  if(!hist.length) log.innerHTML='';
  hist.push({role:'user',parts:[{text:q}]});
  el('m u',q); t.value=''; t.style.height='auto';
  const out=el('m a','Думаю…');
  busy=true; send.disabled=true; ctl=new AbortController();
  let full='';
  try{
    const url='https://generativelanguage.googleapis.com/v1beta/models/'+$('mode').value+':streamGenerateContent?alt=sse';
    const r=await fetch(url,{
      method:'POST',signal:ctl.signal,
      headers:{'content-type':'application/json','x-goog-api-key':getKey()},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:hist})
    });
    if(!r.ok){
      let msg='Ошибка '+r.status;
      try{const j=await r.json();if(j.error&&j.error.message)msg+=': '+j.error.message}catch(e){}
      if(r.status===400||r.status===403){keyBox.classList.add('show');msg+='\nПроверь ключ (🔑).'}
      if(r.status===429)msg='Лимит бесплатных запросов исчерпан. Подожди минуту или попробуй режим «Быстрый».';
      if(r.status===404)msg+='\nЭта модель недоступна, выбери другой режим.';
      throw new Error(msg);
    }
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){
        if(!ln.startsWith('data:'))continue;
        try{const j=JSON.parse(ln.slice(5));
          const ps=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
          if(ps){for(const p of ps){if(p.text&&!p.thought)full+=p.text}out.textContent=full;log.scrollTop=log.scrollHeight}
        }catch(e){}
      }
    }
    hist.push({role:'model',parts:[{text:full||'(пусто)'}]});
  }catch(e){
    hist.pop();
    out.textContent=e.name==='AbortError'?'Остановлено.':(e.message||'Не получилось ответить.');
  }
  busy=false; send.disabled=false; t.focus();
}
$('f').addEventListener('submit',e=>{e.preventDefault();ask(t.value)});
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(t.value)}});
t.addEventListener('input',()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'});
$('clear').onclick=()=>{if(ctl)ctl.abort();hist=[];busy=false;send.disabled=false;home()};
$('keybtn').onclick=()=>keyBox.classList.toggle('show');
$('keysave').onclick=()=>{const v=$('keyin').value.trim();if(v){setKey(v);$('keyin').value='';keyBox.classList.remove('show')}};
if(!getKey())keyBox.classList.add('show');
home();
</script>
</body>
</html>
